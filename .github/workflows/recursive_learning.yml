name: Recursive Learning Loop

on:
  schedule:
    - cron: '30 2 * * *' # 2:30 AM every night, after Discovery
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Run Recursive Learning Logic
        run: |
          # This script analyzes the Business_Intelligence and any Feedback logs
          # to build the 'learned_trends.json' file.
          python3 recursive_learner.py
          # Run the Value Partner Mapping to link supply chains
          python3 value_partner_mapper.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit Learned Intelligence
        run: |
          git config --global user.name "AI Learner Bot"
          git config --global user.email "bot@recursive-learn.com"
          git add "Data/Intelligence/learned_trends.json" "Data/Intelligence/Market_Graph.json"
          git diff-index --quiet HEAD || git commit -m "Recursive Learning Update: $(date +'%Y-%m-%d')"
          git push
