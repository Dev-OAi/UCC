name: Nightly Market Discovery

on:
  schedule:
    - cron: '0 2 * * *' # 2 AM every night
  workflow_dispatch: # Allow manual trigger

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run Discovery Enrichment
        run: |
          # This script will look for fresh UCC results from the last 24h
          # and perform basic web discovery to find "growth clues"
          python3 nightly_discovery.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit Clues
        run: |
          git config --global user.name "Market Discovery Bot"
          git config --global user.email "bot@marketintel.com"
          git add "Business_Intelligence.csv"
          git commit -m "Nightly Discovery Sync: $(date +'%Y-%m-%d')" || echo "No new clues found tonight"
          git push
